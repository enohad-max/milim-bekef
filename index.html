<style>

.chips{gap:14px 12px}

.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #4a3b5c12}.prow:first-child{border-top:0}

 let P=[],next=0;const cols=['#ff7eb6','#ffd35c','#5fd68a','#5aaeff','#a77bff','#ff9f43'],t0=performance.now();
 function burst(){const cx=W*(.15+Math.random()*.7),cy=H*(.12+Math.random()*.4),col=cols[Math.random()*cols.length|0];
  for(let i=0;i<70;i++){const a=Math.PI*2*i/70,v=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.3?'#fff':col})}}

function pickWords(p,n){

 const due=L.filter(w=>p.prog[w.id]&&p.prog[w.id].due<=now).sort((a,b)=>p.prog[a.id].due-p.prog[b.id].due);
 const fresh=shuffle(L.filter(w=>!p.prog[w.id]));
 let out=[...due,...fresh].slice(0,n);
 if(out.length<Math.min(n,L.length))out=out.concat(shuffle(L.filter(w=>!out.includes(w))).slice(0,n-out.length));
 return out;
}

V.game=()=>{const g=S.game;if(!g)return'';
 if(g.left===0&&g.prizes.length)return prizeScreen(g,'<button class="btn blue" data-act="game">עוד משחק</button><button class="btn ghost" data-act="home">חזרה</button>');
 if(g.left===0)return`<div class="center" style="margin-top:20px"><div class="bounce" style="display:inline-block">${squish(P().avatar,'lg')}</div>${g.mistakes?`<h1>כמעט! 💪</h1><p class="big">היו ${g.mistakes} טעויות</p><p>משחק בלי אף טעות נותן כוכבים לסקוויש. נסי שוב!</p>`:`<h1>בלי אף טעות! 🎉</h1><div class="starrow">${Array.from({length:g.stars},(_,i)=>`<span style="--i:${i}">⭐</span>`).join('')}</div><p class="big">קיבלת ⭐ ${g.stars}</p>`}</div>
  ${g.prizes.map(i=>prizeCard(i)).join('')}
  <button class="btn blue" data-act="game">${g.mistakes?'נסי שוב':'עוד משחק'}</button><button class="btn ghost" data-act="home">חזרה</button>`;
 const total=g.en.length,nd=g.done.length;
 const card=(w,side)=>`<button class="m gm ${side} ${g.done.includes(w.id)?'done':''} ${g.sel&&g.sel.id===w.id&&g.sel.side===side?'sel':''}" data-act="m" data-id="${w.id}" data-side="${side}"><span>${esc(side==='en'?w.en:w.he)}</span>${side==='en'?'<i class="gs">🔊</i>':''}</button>`;
 return`<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

 {id:'safari',n:'ספארי וג׳ונגל',ic:'🦁',c:'#ffd35c',d:'#e0a920',l:[43,[58,63],71,73,[103,107],109,110]},

 {id:'food',n:'ממתקים ואוכל',ic:'🍕',c:'#ff8a8a',d:'#e05a5a',l:[[76,80],89,[130,151],[270,277]]},
 {id:'nature',n:'טבע ומזג אוויר',ic:'🌸',c:'#b88cff',d:'#8f63e0',l:[[81,87],152,[154,163],[284,285]]},
 {id:'things',n:'חפצים ודמויות',ic:'🎈',c:'#35cfc0',d:'#1f9f93',l:[[164,183]]},

 {id:'kingdom',n:'אגדות וממלכה',ic:'🏰',c:'#d28cff',d:'#a455e0',l:[[208,217]]},
 {id:'vehicles',n:'כלי רכב',ic:'🚗',c:'#ff7a7a',d:'#d94545',l:[[218,227]]},
 {id:'sports',n:'ספורט ומשחקים',ic:'⚽',c:'#5fd68a',d:'#2f9f5a',l:[[228,236]]},
 {id:'music',n:'מוזיקה ואמנות',ic:'🎵',c:'#ff9ec7',d:'#e0558f',l:[[237,244]]},
 {id:'dinos',n:'עולם הדינוזאורים',ic:'🦖',c:'#9bd84f',d:'#6fa83a',l:[[245,252]]},

 {id:'bugs',n:'חרקים וזוחלים',ic:'🐞',c:'#ffb347',d:'#d97a1f',l:[[262,269]]},
 {id:'rare',n:'הנדירים',ic:'💎',c:'#ffc400',d:'#d99a00',rare:1}];
const wExpand=a=>a.flatMap(x=>Array.isArray(x)?Array.from({length:x[1]-x[0]+1},(_,k)=>x[0]+k):[x]);
WORLDS.forEach(w=>{w.idx=w.rare?[...Array(N_SQ).keys()].filter(isRare):wExpand(w.l)});
const wlist=()=>{const used=new Set(WORLDS.flatMap(w=>w.idx)),rest=[...Array(N_SQ).keys()].filter(i=>!used.has(i));
 return rest.length?[...WORLDS,{id:'more',n:'עוד הפתעות',ic:'✨',c:'#a77bff',d:'#7d51d6',idx:rest}]:WORLDS};
const worldStat=(w,p)=>{const own=w.idx.filter(i=>p.coll.includes(i));return{own,n:own.length,t:w.idx.length}};
const wBadge=(n,t)=>`<span class="wbadge ${n===t?'full':''}">${n===t?'✓':'★'} ${n}/${t}</span>`;
const newList=p=>(p.nw||[]).filter(i=>p.coll.includes(i));
const sqSlot=(i,p,name)=>{const nw=(p.nw||[]).includes(i);return`<div class="slot ${isRare(i)?'rare':''} ${p.avatar===i?'cur':''} ${nw?'isnew':''}" data-act="avatar" data-i="${i}">${nw?'<span class="newtag">חדש!</span>':''}${isRare(i)?'<span class="rtag">✨</span>':''}${squish(i)}${name?`<small>${sqName(i)}</small>`:''}</div>`};
V.prizes=()=>{const p=P(),ws=wlist(),w=S.world&&ws.find(x=>x.id===S.world);
 if(w)return V.world(w,p);
 const recent=p.coll.slice(-8).reverse(),fav=(p.fav||[]).filter(i=>p.coll.includes(i)),nl=newList(p);
 if(D.settings.flatColl){const own=p.coll.slice().sort((a,b)=>a-b);return`<div class="top"><button class="btn small ghost" data-act="pback">→</button><h2 class="sp">הסקווישים שלי 🏆</h2><div class="pill">${p.coll.length}/${N_SQ}</div></div>
  ${nl.length?'<div class="newline">🎁 הסקווישים החדשים זוהרים כאן!</div>':''}<div class="collgrid">${own.map(i=>sqSlot(i,p,1)).join('')}</div>`}
 const row=(t,a)=>a.length?`<div class="panel srow-p"><h3>${t}</h3><div class="srow">${a.map(i=>sqSlot(i,p)).join('')}</div></div>`:'';
 return`<div class="top"><button class="btn small ghost" data-act="pback">→</button><h2 class="sp">הסקווישים שלי 🏆</h2><div class="pill">${p.coll.length}/${N_SQ}</div></div>
 ${nl.length?`<button class="newban" data-act="shownew"><span class="nbv">${nl.slice(-3).map(i=>squish(i)).join('')}</span><span class="nbt"><b>🎁 ${nl.length>1?nl.length+' סקווישים חדשים!':'סקוויש חדש!'}</b><span>${esc(sqName(nl[nl.length-1]))}</span></span><span class="nbgo">הראי לי ▶</span></button>`:`<div class="hint center">כל ${spp()} ⭐ = סקוויש חדש. בחרי עולם לגלות 👇</div>`}
 ${row('🆕 החדשים',recent)}${row('💖 המועדפים',fav)}
 <div class="wgrid">${ws.map(wl=>{const{own,n,t}=worldStat(wl,p),pv=own.slice(-3);

V.world=(w,p)=>{const{own,n,t}=worldStat(w,p),shown=w.idx.filter(i=>!p.coll.includes(i)).slice(0,2);

function setupCar(){const c=document.querySelector('.pcar');if(!c)return;const cards=[...c.querySelectorAll('.pc')],dock=[...document.querySelectorAll('.pd')];
 const upd=()=>{const r=c.getBoundingClientRect(),mid=r.left+r.width/2;let best=0,bd=1e9;
  cards.forEach((el,i)=>{const b=el.getBoundingClientRect(),d=(b.left+b.width/2-mid)/b.width,a=Math.min(1,Math.abs(d));
   el.style.transform=`scale(${1-.2*a}) rotateY(${-d*26}deg)`;el.style.opacity=1-.5*a;if(Math.abs(d)<bd){bd=Math.abs(d);best=i}});
  cards.forEach((el,i)=>el.classList.toggle('side',i!==best));dock.forEach((el,i)=>el.classList.toggle('on',i===best))};
 let raf=0;c.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(upd)},{passive:true});
 const st=Math.max(0,D.profiles.findIndex(p=>p.id===S.lastPid));if(cards[st])cards[st].scrollIntoView({inline:'center',block:'nearest'});upd()}

const sayBtn=t=>`<button class="speak" data-act="say" data-t="${esc(t)}">🔊</button>`;
const shuf2=a=>{let b=shuffle(a),k=0;while(a.length>1&&b.join('|')===a.join('|')&&k++<9)b=shuffle(a);return b};
const G={
 first(n=8){const seen=new Set(),pool=[...Object.entries(CATS).filter(([k])=>k!=='days').flatMap(([,v])=>v).filter(w=>!/^\d/.test(w[2])),...LW.map(([l,e,p])=>[e,'',p]),...Object.values(CVC).flat()].filter(w=>w[0][0]!=='x'&&!seen.has(w[0])&&seen.add(w[0]));
  return sample(pool,n).map(w=>{const L=w[0][0].toUpperCase(),opts=shuffle([L,...sample('ABCDEFGHIJKLMNOPQRSTUVWYZ'.split('').filter(c=>c!==L),3)]);
   return{t:'q',prompt:`<div class="pbig">${pic(w[2],w[0])}</div><div class="en word" data-say="${esc(w[0])}">${hw(w[0])}</div>${sayBtn(w[0])}<div class="hint">באיזו אות מתחילה המילה?</div>`,say:w[0],opts,ans:opts.indexOf(L),oc:'lt',lab:'אות ראשונה: '+w[0]}})},
 vowel(n=8){return sample(Object.values(CVC).flat(),n).map(w=>{const v=w[0][1];
   return{t:'q',prompt:`<div class="pbig">${pic(w[2],w[0])}</div><div class="en word" data-say="${esc(w[0])}">${letterHtml(w[0][0])}<span class="blank">_</span>${letterHtml(w[0][2])}</div>${sayBtn(w[0])}<div class="hint">איזו אות חסרה באמצע?</div>`,say:w[0],opts:VOW,ans:VOW.indexOf(v),oc:'lt',lab:'אות חסרה: '+w[0]}})},
 spell(n=6){return sample(Object.values(CVC).flat(),n).map(w=>({t:'b',prompt:`<div class="pbig">${pic(w[2],w[0])}</div>${sayBtn(w[0])}<div class="hint">סדרי את האותיות ובני את המילה</div>`,say:w[0],target:w[0].split(''),tiles:shuf2(w[0].split('')),lab:'איות: '+w[0]}))},
 name(p){const nm=(p.en||'').trim();if(!nm)return[];return[{t:'b',prompt:`<div class="pbig">🙂</div>${sayBtn(nm)}<div class="hint">בני את השם שלי</div>`,say:nm,target:nm.split(''),tiles:shuf2(nm.split('')),lab:'השם שלי: '+nm}]},
 vocab(cat,n=8){const L=CATS[cat];return sample(L,Math.min(n,L.length)).map(w=>{const opts=shuffle([w[0],...sample(L.filter(x=>x[0]!==w[0]).map(x=>x[0]),3)]);
   return{t:'q',prompt:`<div class="pbig">${pic(w[2],w[0])}</div><div class="hint">איך אומרים באנגלית?</div>`,fin:w[0],opts,ans:opts.indexOf(w[0]),oc:'en',lab:w[0]+' · '+w[1]}})},
 vocabMatch(cat){const L=sample(CATS[cat],5);return[{t:'m',pairs:L.map((w,i)=>[`<span class="mp">${pic(w[2])}</span>`,esc(w[0]),i,w[0]+' · '+w[1],[w[0],w[0]]]),lc:'',rc:'en'}]},
 colors(){const c=shuffle(COLORS),m=a=>({t:'m',pairs:a.map((w,i)=>[esc(w[0]),esc(w[1]),i,w[0]+' · '+w[1],[w[0],w[1]]]),lc:'en',rc:''});
  const qs=sample(COLORS,5).map(w=>{const opts=shuffle([w[0],...sample(COLORS.filter(x=>x[0]!==w[0]).map(x=>x[0]),3)]);
   return{t:'q',prompt:`<div class="pbig">${pic(w[2],w[0])}</div><div class="hint">איזה צבע זה באנגלית?</div>`,fin:w[0],opts,ans:opts.indexOf(w[0]),oc:'en',lab:'צבע: '+w[0]}});
  return[m(c.slice(0,5)),m(c.slice(5)),...qs]},
 letters(n=5){const ab='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');return[{t:'m',pairs:sample(ab,n).map((l,i)=>[letterHtml(l),letterHtml(l.toLowerCase()),i,l+' '+l.toLowerCase(),[l,l]]),lc:'lt',rc:'lt'}]},
 cloze(n=6){return sample(SENTS,n).map(s=>{const k=s[2],opts=shuffle([k,...sample(SENTS.map(x=>x[2]).filter(x=>x!==k),2)]);
   return{t:'q',prompt:`<div class="en word sent">${esc(s[0].replace(new RegExp('\\b'+k+'\\b','i'),'____'))}</div><div class="hint">${esc(s[1])}</div>`,fin:s[0],opts,ans:opts.indexOf(k),oc:'en',lab:'משפט: '+s[0]}})},
 order(n=4){return sample(SENTS,n).map(s=>{const w=s[0].split(' ');return{t:'b',w:1,prompt:`<div class="word" style="font-size:1.6rem">${esc(s[1])}</div>${sayBtn(s[0])}<div class="hint">סדרי את המילים למשפט באנגלית</div>`,say:s[0],target:w,tiles:shuf2(w),lab:'סידור משפט: '+s[0]}})},
 mock(p){const cats=Object.keys(CATS);return shuffle([...G.first(3),...G.vowel(3),...G.spell(2),...G.name(p),...G.vocab(pick(cats),2),...G.letters(5),...G.colors().slice(0,1),...G.colors().slice(2,4),...G.cloze(2),...G.order(1)])}

function nextItem(){const a=S.act;logItem();a.im=0;a.iw=[];a.i++;a.pos=0;a.used=[];a.sel=null;a.done=[];a.ord=null;a.lock=false;if(a.i>=a.items.length)finishAct();else render()}
function finishAct(){const a=S.act,p=P();
 if(!a.mist){const n=Math.min(STARS_PERFECT,a.items.length);for(let i=0;i<n;i++)addStar(p,a);a.stars=n;confetti();if(a.prizes.some(isRare))setTimeout(fireworks,300)}

V.trace=()=>`<div class="top"><button class="btn small ghost" data-act="hub">→</button><h2 class="sp">כותבים את השם 🖍️</h2></div>
 <div class="center hint">עברי עם האצבע על האותיות לפי המספרים, כמו שכותבים ביד ✍️</div>
 <div class="panel"><canvas id="tc" style="width:100%;height:240px;touch-action:none;border-radius:20px;background:#fffdf5;display:block"></canvas></div>
 <div class="row"><button class="btn ghost" data-act="tclear">🧽 נקי</button><button class="btn green" data-act="tdone">סיימתי ✓ (⭐ כוכב)</button></div>`;
function setupTrace(){const c=document.getElementById('tc');if(!c)return;const d=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*d;c.height=H*d;
 const x=c.getContext('2d');x.scale(d,d);const nm=((P().en||'').trim()||'Name').split('');
 const adv=ch=>HW[ch]?HW[ch].w+16:34,total=nm.reduce((t,ch)=>t+adv(ch),0)-16,sc=Math.min((W-40)/total,(H-50)/120),ox=(W-total*sc)/2,oy=(H-120*sc)/2;
 const lay=[];let cx=0;nm.forEach(ch=>{if(HW[ch])lay.push([ch,cx]);cx+=adv(ch)});
 const guide=()=>{x.clearRect(0,0,W,H);x.fillStyle='#fffdf5';x.fillRect(0,0,W,H);x.lineWidth=2;
  [[8,'#f5b5c8',[]],[40,'#c9d8f0',[8,8]],[80,'#8fb0e8',[]]].forEach(([y,col,dash])=>{x.strokeStyle=col;x.setLineDash(dash);x.beginPath();x.moveTo(10,oy+y*sc);x.lineTo(W-10,oy+y*sc);x.stroke()});x.setLineDash([]);
  lay.forEach(([ch,gx])=>HW[ch].p.forEach(pd=>{x.save();x.translate(ox+gx*sc,oy);x.scale(sc,sc);x.lineWidth=15;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#e4daf2';x.stroke(new Path2D(pd));x.restore()}));
  lay.forEach(([ch,gx])=>HW[ch].p.forEach((pd,k)=>{const m=pd.match(/^M(-?[\d.]+) (-?[\d.]+)/);if(!m)return;const px=ox+(gx+ +m[1])*sc,py=oy+ +m[2]*sc;
   x.fillStyle='#4fcf7f';x.beginPath();x.arc(px,py,8,0,7);x.fill();x.fillStyle='#fff';x.font='bold 11px Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(k+1),px,py+.5)}))};
 guide();window._tink=0;window._tneed=.35*nm.length*130*sc;window._tg=()=>{guide();window._tink=0};
 let on=false,lx=0,ly=0;const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--pink-d')||'#e0558f';x.lineWidth=9;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke()};
 c.onpointermove=e=>{if(!on)return;const[a,b]=pos(e);window._tink+=Math.hypot(a-lx,b-ly);lx=a;ly=b;x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b)};
 c.onpointerup=c.onpointercancel=()=>{on=false}}

  const[t,g]=RUN[k](el.dataset.c);startAct(t,g,k+(el.dataset.c?':'+el.dataset.c:''))},

  const p=P(),r={stars:0,prizes:[]};addStar(p,r);logEv({type:'s',src:'trace',title:'כתיבת השם',m:0,n:1,st:1});tick(p);save();A.hub();toast('⭐ קיבלת כוכב!');r.prizes.forEach(showPrize)},
 opt(el){const a=S.act,it=a.items[a.i];if(a.lock)return;const i=+el.dataset.i;

  else{say(it.opts[i]);a.mist++;a.im++;el.classList.add('bad');const m=document.getElementById('mc');if(m)m.textContent='❌ '+a.mist}},
 tile(el){const a=S.act,it=a.items[a.i];if(a.lock)return;const k=+el.dataset.k;if(a.used.includes(k))return;say(it.tiles[k]);
  if(it.tiles[k]===it.target[a.pos]){a.used.push(k);a.pos++;
   if(a.pos>=it.target.length){a.lock=true;say(it.say||it.target.join(' '));render(true);setTimeout(nextItem,1000);return}
   render(true)}
  else{a.mist++;a.im++;el.classList.add('bad');const m=document.getElementById('mc');if(m)m.textContent='❌ '+a.mist;setTimeout(()=>el.classList.remove('bad'),450)}},
 mt(el){const a=S.act,it=a.items[a.i],id=+el.dataset.id,side=el.dataset.side;if(a.done.includes(id)||a.lock)return;
  if(!D.settings.noMatchSay){const pr=it.pairs.find(q=>q[2]===id),sy=pr&&pr[4]&&pr[4][side==='L'?0:1];if(sy)say(sy)}
  if(!a.sel||a.sel.side===side){a.sel={id,side};render(true);return}
  if(a.sel.id===id){a.done.push(id);a.sel=null;if(a.done.length===it.pairs.length){a.lock=true;render(true);setTimeout(nextItem,350);return}render(true)}
  else{a.mist++;a.im++;a.iw.push(a.sel.id,id);const f=document.querySelector('.m.sel');el.classList.add('bad');if(f)f.classList.add('bad');a.sel=null;setTimeout(()=>render(true),250)}}
});

 save()}
const bakWarn=()=>{const t=(D.settings||{}).lastBackup,d=t?Math.floor((Date.now()-t)/864e5):null;
 return d===null||d>=7?`<div class="pcard exam"><b>💾 ${d===null?'עוד לא יצרת גיבוי':'הגיבוי האחרון לפני '+d+' ימים'}</b><div class="hint">מומלץ לייצא גיבוי לפני כל עדכון.</div><button class="btn small blue" style="width:auto;margin-top:8px" data-act="export">⬇️ ייצוא גיבוי עכשיו</button></div>`:''};
const ACT_NAME={cards:'כרטיסיות',match:'משחק התאמה',trace:'כותבים שם',letters:'אותיות',first:'אות ראשונה',vowel:'אות חסרה',spell:'בונים מילה',name:'בונים שם',colors:'צבעים',cloze:'משפט חסר',order:'מסדרים משפט',mock:'מבחן דמה'};
const srcName=k=>{const[b,c]=String(k).split(':');return b==='vocab'?'אוצר מילים: '+(CAT_NAME[c]||c):(ACT_NAME[b]||b)};
const fmtTs=ts=>new Date(ts).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const failedEv=e=>e.src==='cards'&&e.type==='w'?e.res!=='know':(e.m||0)>0;
const rateCol=r=>r>=.85?['🟢','#5fd68a']:r>=.6?['🟡','#ffd35c']:['🔴','#ff6b6b'];
const RES={know:'ידעה ✅',almost:'כמעט 🤔',no:'לא ידעה ❌'};

V.parent=()=>{
 if(!S.gate)return`<div class="top"><button class="btn small ghost" data-act="back">→</button><h2>אזור הורים 🔒</h2></div>
  <div class="panel center"><p class="big">🔑 סיסמת מבוגרים</p><input id="gate" type="password" inputmode="numeric" autocomplete="off" style="text-align:center;font-size:1.6rem"><br><br><button class="btn" data-act="gate">כניסה</button></div>`;
 const pid=S.pp&&D.profiles.some(p=>p.id===S.pp)?S.pp:D.profiles[0].id,range=S.pr===undefined?7:S.pr,since=range?Date.now()-range*864e5:0;
 const L=(D.log||[]).filter(e=>e.p===pid&&e.ts>=since),items=L.filter(e=>e.type!=='s'),ses=L.filter(e=>e.type==='s');
 const grp={},sk={};
 items.forEach(e=>{const f=failedEv(e)?1:0,g=grp[e.lab]||(grp[e.lab]={lab:e.lab,n:0,f:0,ts:0});g.n++;g.f+=f;g.ts=Math.max(g.ts,e.ts);
  const s=sk[srcName(e.src)]||(sk[srcName(e.src)]={n:0,f:0});s.n++;s.f+=f});
 const all=Object.values(grp),hard=all.filter(g=>g.f>=2).sort((a,b)=>b.f-a.f||b.f/b.n-a.f/a.n),once=all.filter(g=>g.f===1).sort((a,b)=>b.ts-a.ts);
 const tot=items.length,fail=items.filter(failedEv).length,rate=tot?1-fail/tot:null,perfect=ses.filter(e=>!e.m).length;
 const last=L.length?fmtTs(L[L.length-1].ts):'—';
 const skills=Object.entries(sk).map(([n,v])=>({n,rate:1-v.f/v.n,cnt:v.n,f:v.f})).sort((a,b)=>a.rate-b.rate);
 const lim=S.pl||40,rows=[...L].reverse().slice(0,lim);
 const resTxt=e=>e.type==='s'?`סיבוב: ${e.m?e.m+' טעויות':'בלי טעויות 🎉'} (${e.n} פריטים)${e.st?' · ⭐'+e.st:''}`:(e.src==='cards'&&e.type==='w'?RES[e.res]||e.res:(e.m?`❌ ${e.m} טעויות`:'✅ נכון'));
 const seg=items=>`<div class="seg">${items.map(([on,act,attr,t])=>`<button class="${on?'on':''}" data-act="${act}" ${attr}>${t}</button>`).join('')}</div>`;
 const rc=rate===null?'#4a3b5c':rateCol(rate)[1];
 return`<div class="pro"><div class="top"><button class="btn small ghost" data-act="back">→</button><h2 class="sp">מידע להורה</h2><button class="btn small ghost" data-act="p2s">⚙️</button></div>
 ${seg(D.profiles.map(p=>[p.id===pid,'ppick',`data-id="${p.id}"`,esc(p.name)]))}
 ${seg([[7,'7 ימים'],[30,'30 ימים'],[0,'הכול']].map(([d,t])=>[range===d,'prange',`data-d="${d}"`,t]))}
 <div class="pcard"><h3>סיכום</h3>
  <div class="kpis"><div class="kpi"><b>${tot}</b><span>תשובות</span></div><div class="kpi"><b style="color:${rc}">${rate===null?'—':Math.round(rate*100)+'%'}</b><span>הצלחה</span></div><div class="kpi"><b>${ses.length}</b><span>סיבובים</span></div><div class="kpi"><b>${perfect}</b><span>בלי טעויות</span></div></div>
  <div class="hint" style="margin-top:10px">פעילות אחרונה: ${last}</div></div>
 ${bakWarn()}
 ${tot?'':'<div class="pcard center hint">עדיין אין נתונים לתקופה הזאת. התרגילים נרשמים כאן אוטומטית.</div>'}
 <div class="pcard"><h3>נושאים</h3>
  ${skills.map(s=>{const col=rateCol(s.rate)[1];return`<div class="skrow"><div class="sktop"><span>${esc(s.n)}</span><span class="hint">${Math.round(s.rate*100)}% · ${s.f}/${s.cnt}</span></div><div class="meter"><i style="width:${Math.round(s.rate*100)}%;background:${col}"></i></div></div>`}).join('')||'<p class="hint">—</p>'}</div>
 <div class="pcard"><h3>טעויות חוזרות</h3>
  ${hard.map(g=>`<div class="prow"><span class="sp" dir="auto"><b>${esc(g.lab)}</b></span><span class="badge">${g.f}/${g.n}</span></div>`).join('')||'<p class="hint">אין כרגע. מצוין! 🎉</p>'}</div>
 ${once.length?`<div class="pcard"><h3>טעתה פעם אחת</h3><div class="tags">${once.slice(0,30).map(g=>`<span class="tag" dir="auto">${esc(g.lab)}</span>`).join('')}</div></div>`:''}
 <details class="pcard"><summary><h3>יומן (${L.length})</h3></summary>
  ${rows.map(e=>`<div class="prow lg"><div class="sp"><b dir="auto">${esc(e.lab||e.title||'')}</b><div class="hint">${esc(srcName(e.src))} · ${fmtTs(e.ts)}</div></div><span class="lgres">${resTxt(e)}</span></div>`).join('')||'<p class="hint">היומן ריק.</p>'}
  ${L.length>lim?'<br><button class="btn small ghost" data-act="pmore">הצג עוד</button>':''}</details>
 <div class="row"><button class="btn small blue" data-act="exportlog">⬇️ ייצוא יומן</button><button class="btn small ghost" data-act="clearlog">🗑️ מחיקת יומן</button></div></div>`}

Object.assign(A,{
 parent(){S.back=S.screen;S.gate=false;S.q=[(Math.random()*6+4|0),(Math.random()*6+4|0)];S.pl=40;go('parent')},
 s2p(){S.pl=40;go('parent')},
 p2s(){S.sl=null;S.so='';go('settings')},
 ppick(el){S.pp=el.dataset.id;S.pl=40;render(true)},
 prange(el){S.pr=+el.dataset.d;S.pl=40;render(true)},
 pmore(){S.pl=(S.pl||40)+60;render(true)},
 exportlog(){const nm=id=>(D.profiles.find(p=>p.id===id)||{name:'?'}).name;
  saveFile('milim-log.json',JSON.stringify((D.log||[]).map(e=>Object.assign({time:new Date(e.ts).toISOString(),child:nm(e.p)},e)),null,1))},
 clearlog(){const pid=S.pp&&D.profiles.some(p=>p.id===S.pp)?S.pp:D.profiles[0].id;
  if(confirm('למחוק את כל היומן של '+(D.profiles.find(p=>p.id===pid)||{}).name+'?')){D.log=(D.log||[]).filter(e=>e.p!==pid);save();render(true)}}
});


function showPrize(i){confetti();if(isRare(i))setTimeout(fireworks,300);
 const m=document.createElement('div');m.className='modal przfull';
 m.innerHTML=`<div class="przin"><div class="przc">${prizeCard(i)}</div><div class="przbtns"><button class="btn" data-close="1">יפה! 💖</button></div></div>`;
 m.addEventListener('click',e=>{if(e.target===m||e.target.dataset.close)m.remove()});document.body.appendChild(m)}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#5fd68a;color:#fff;font-weight:900;padding:10px 20px;border-radius:99px;box-shadow:0 5px 0 #33a862;z-index:60';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}

// ---------- סקווישים אינטראקטיביים: אצבע אחת מותחת, שתיים מותחות ומכווצות, ואחרי כל פעולה הם חוזרים לצורה הטבעית ----------
(()=>{const ptr=new Map();let el=null,svg=null,ret=null,s0=null,g0=null,moved=false,cur='';
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const pts=()=>[...ptr.values()];
 const basis=()=>{const p=pts();if(p.length===1)s0={x:p[0].x,y:p[0].y};
  else if(p.length>1){const[a,b]=p,dx=b.x-a.x,dy=b.y-a.y;g0={d:Math.hypot(dx,dy)||1,a:Math.atan2(dy,dx),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}};
 const draw=()=>{const p=pts();if(!p.length)return;
  if(p.length===1){const dx=p[0].x-s0.x,dy=p[0].y-s0.y,L=Math.hypot(dx,dy),t=Math.atan2(dy,dx),k=1+clamp(L/120,0,1);
   cur=`translate(${dx*.4}px,${dy*.4}px) rotate(${t}rad) scale(${k},${1/Math.sqrt(k)}) rotate(${-t}rad)`}
  else{const[a,b]=p,dx=b.x-a.x,dy=b.y-a.y,r=clamp((Math.hypot(dx,dy)||1)/g0.d,.55,2.2);
   let w=Math.atan2(dy,dx)-g0.a;w=Math.atan2(Math.sin(w),Math.cos(w));w=clamp(w,-1.1,1.1);
   cur=`translate(${((a.x+b.x)/2-g0.mx)*.5}px,${((a.y+b.y)/2-g0.my)*.5}px) rotate(${g0.a}rad) scale(${r},${1/Math.sqrt(r)}) skewY(${w*.7}rad) rotate(${-g0.a+w*.4}rad)`}
  svg.style.transform=cur};
 const back=()=>{if(!svg)return;const f=cur,v=svg;v.style.transform='';
  ret=v.animate([{transform:f},{transform:'none'}],{duration:900,easing:'cubic-bezier(.2,2.1,.4,1)'});
  ret.onfinish=()=>{ret=null};el=null;svg=null;cur=''};
 document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-squish]');if(!t)return;
  if(el&&el!==t)return;
  if(!el){el=t;svg=t.querySelector('svg');if(ret){ret.cancel();ret=null}svg.classList.remove('squish');moved=false}
  if(ptr.size>=2)return;
  try{t.setPointerCapture(e.pointerId)}catch(_){}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});basis();e.preventDefault()});
 document.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;
  const p=ptr.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;moved=true;draw()});
 const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);
  if(ptr.size)basis();else{if(moved){const k=ev=>{ev.stopImmediatePropagation();ev.preventDefault()};document.addEventListener('click',k,true);setTimeout(()=>document.removeEventListener('click',k,true),0)}back()}};
 document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up)})();

document.addEventListener('click',e=>{
 const sy=e.target.closest('[data-say]');if(sy&&!e.target.closest('[data-act="say"]')){say(sy.dataset.say);return}
 const sq=e.target.closest('[data-squish]');if(sq){const s=sq.querySelector('svg');s.classList.remove('squish');void s.getBoundingClientRect();s.classList.add('squish');if(sq.hasAttribute('data-pet'))petTalk();return}
 const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',e=>{
 if(e.target.dataset.change==='lesson'){S.lesson=e.target.value}
 if(e.target.dataset.name){const p=D.profiles.find(p=>p.id===e.target.dataset.name);if(p){p.name=e.target.value.trim()||p.name;save()}}
 if(e.target.dataset.wid){const w=D.words.find(w=>w.id===e.target.dataset.wid),f=e.target.dataset.f,v=e.target.value.trim();
  if(w){if(v){w[f]=v;save()}else e.target.value=w[f]}}
 if(e.target.dataset.lowner!==undefined){D.words.forEach(w=>{if((w.lesson||'')===S.sl&&(w.owner||'')===(S.so||''))w.owner=e.target.value});S.so=e.target.value;save()}
 if(e.target.dataset.lname!==undefined){const nl=e.target.value.trim();
  if(!nl){e.target.value=S.sl;return}
  D.words.forEach(w=>{if((w.lesson||'')===S.sl&&(w.owner||'')===(S.so||''))w.lesson=nl});if(S.lesson===S.sl)S.lesson=nl;S.sl=nl;save()}
 if(e.target.dataset.en){const p=D.profiles.find(p=>p.id===e.target.dataset.en);if(p){p.en=e.target.value.trim();save()}}
 if(e.target.dataset.exam){D.settings.exam=D.settings.exam||{};D.settings.exam[e.target.dataset.exam]=e.target.value.trim();save()}
 if(e.target.dataset.coll!==undefined){D.settings.flatColl=e.target.value==='1';save()}
 if(e.target.dataset.msay!==undefined){D.settings.noMatchSay=e.target.value==='0';save()}
 if(e.target.dataset.rprof!==undefined){S.rp=e.target.value;S.rsel=new Set();render(true);return}
 if(e.target.dataset.rate!==undefined){D.settings.rate=+e.target.value;save();say('Apple')}
 if(e.target.dataset.pw!==undefined){const v=e.target.value.trim();if(v.length>=4){D.settings.pw=v;save();toast('הסיסמה עודכנה 🔑')}else{e.target.value=D.settings.pw||'2101975';alert('הסיסמה צריכה להיות לפחות 4 תווים')}}
 if(e.target.dataset.spp!==undefined){D.settings.spp=Math.max(1,Math.min(100,+e.target.value||10));save()}
 if(e.target.dataset.goal!==undefined){D.settings.goal=Math.max(1,+e.target.value||10);save()}
});

document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
 if(e.target.id==='gate')return A.gate();
 if(e.target.id==='ne')document.getElementById('nh').focus();
 else if(e.target.id==='nh')A.addword()});

render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&['profiles','home'].includes(S.screen))location.reload()})}
</script>
